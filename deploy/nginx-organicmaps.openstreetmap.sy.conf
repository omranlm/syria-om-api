# Syria Organic Maps: website (/), API (/api/), map files for the app (/mapdata/).
# /etc/nginx/sites-available/organicmaps.openstreetmap.sy (HTTP only: certbot --nginx adds HTTPS and the redirect).
server {
    listen 80;
    listen [::]:80;
    server_name organicmaps.openstreetmap.sy;

    root /var/www/organicmaps-site;
    index index.html;

    # LoopBack API on 127.0.0.1:3000; the /api prefix is stripped.
    location = /api { return 301 /api/; }
    location = /api/admin { return 301 /api/admin/; }
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API rate-limits by the first X-Forwarded-For address: set it, never pass the client's own.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 90s;
        client_max_body_size 20m;
    }

    # The app pings each map server with HEAD <server>/ and drops any that does not answer 200.
    location = /mapdata/ {
        default_type text/plain;
        return 200 "Syria Organic Maps map data\n";
    }

    # Map data in the Organic Maps layout: data_version.json, maps/<v>/*.mwm, terrain/<v>/*.twm.
    location /mapdata/ {
        alias /opt/syria-om-api/maps-pipeline/out/;
        autoindex off;
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
