<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syria Organic Maps — Admin</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --teal: #0c7c70; --dark: #21242a; --bg: #f4f6f7; --card: #fff; --text: #1c1f24; --muted: #6b7280; --line: #e3e7ea; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--dark); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  header button, header a { color: #fff; background: transparent; border: 1px solid #ffffff55; border-radius: 6px; padding: 6px 10px; cursor: pointer; text-decoration: none; }
  nav { display: flex; gap: 4px; padding: 10px 16px 0; }
  nav button { background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; cursor: pointer; font-weight: 600; color: var(--muted); }
  nav button.active { color: var(--teal); border-color: var(--teal); }
  main { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card .k { color: var(--muted); font-size: 12px; } .card .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { background: #f9fafb; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  tr.row:hover { background: #f0f7f6; cursor: pointer; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  input, select { padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  button.primary { background: var(--teal); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  button.ghost { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  #map { height: 520px; border-radius: 10px; border: 1px solid var(--line); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #e5e7eb; }
  .pill.active { background: #fde68a; } .pill.stopped { background: #d1fae5; } .pill.paused { background: #e0e7ff; } .pill.blocked { background: #fecaca; }
  .login { max-width: 360px; margin: 80px auto; background: var(--card); padding: 24px; border-radius: 12px; border: 1px solid var(--line); }
  .login input { width: 100%; margin: 6px 0 12px; }
  .hidden { display: none !important; }
  .err { color: #b91c1c; min-height: 1.2em; }
  pre { margin: 0; font-size: 12px; white-space: pre-wrap; }
  .chart { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .chart div { flex: 1; background: var(--teal); min-height: 2px; border-radius: 2px 2px 0 0; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Syria Organic Maps — Admin</h1>
  <a href="/explorer" target="_blank">API explorer</a>
  <button id="logout" class="hidden">Log out</button>
</header>

<div id="login" class="login">
  <h2>Admin login</h2>
  <label>Phone<input id="l-phone" placeholder="+963000000000"></label>
  <label>Password<input id="l-pass" type="password"></label>
  <button class="primary" id="l-btn">Log in</button>
  <div class="err" id="l-err"></div>
</div>

<div id="app" class="hidden">
  <nav>
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="users">Users</button>
    <button data-tab="sessions">Sessions</button>
    <button data-tab="activity">Activity</button>
  </nav>
  <main>
    <section id="tab-overview">
      <div class="cards" id="cards"></div>
      <h3>Sessions per day (last 30 days)</h3>
      <div class="chart" id="chart"></div>
    </section>

    <section id="tab-users" class="hidden">
      <div class="toolbar"><input id="u-q" placeholder="Search phone or name"><button class="ghost" id="u-go">Search</button></div>
      <table><thead><tr><th>Phone</th><th>Name</th><th>Role</th><th>Status</th><th>Sessions</th><th>Distance</th><th>Moving</th><th>Devices</th><th>Last seen</th><th></th></tr></thead><tbody id="u-rows"></tbody></table>
    </section>

    <section id="tab-sessions" class="hidden">
      <div class="toolbar">
        <input id="s-user" placeholder="User id (optional)" size="38">
        <select id="s-status"><option value="">any status</option><option>active</option><option>paused</option><option>stopped</option></select>
        <input id="s-from" type="date"><input id="s-to" type="date">
        <button class="ghost" id="s-go">Filter</button>
      </div>
      <div class="split">
        <table><thead><tr><th>Started</th><th>User</th><th>Status</th><th>Distance</th><th>Client</th><th>Moving</th><th>Points</th></tr></thead><tbody id="s-rows"></tbody></table>
        <div><div id="map"></div><pre id="s-detail"></pre></div>
      </div>
    </section>

    <section id="tab-activity" class="hidden">
      <div class="toolbar">
        <input id="a-user" placeholder="User id (optional)" size="38">
        <input id="a-type" placeholder="type, e.g. map_update">
        <button class="ghost" id="a-go">Filter</button>
      </div>
      <table><thead><tr><th>When</th><th>User</th><th>Type</th><th>Session</th><th>Payload</th></tr></thead><tbody id="a-rows"></tbody></table>
    </section>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = { get token() { try { return sessionStorage.getItem('adminToken') || ''; } catch { return ''; } },
                  set token(v) { try { v ? sessionStorage.setItem('adminToken', v) : sessionStorage.removeItem('adminToken'); } catch {} } };
  const km = m => m == null ? '–' : (m / 1000).toFixed(2) + ' km';
  const dur = s => s == null ? '–' : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`;
  const when = d => d ? new Date(d).toLocaleString() : '–';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const pill = s => `<span class="pill ${esc(s)}">${esc(s)}</span>`;

  async function api(path, opts = {}) {
    const res = await fetch(path, {...opts, headers: {'Content-Type': 'application/json', Authorization: 'Bearer ' + store.token, ...(opts.headers || {})}});
    if (res.status === 401 || res.status === 403) { if (store.token) { store.token = ''; showLogin('Session expired, log in again'); } throw new Error('unauthorized'); }
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error?.message || res.statusText);
    return res.json();
  }

  function showLogin(msg = '') { $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); $('#logout').classList.add('hidden'); $('#l-err').textContent = msg; }
  function showApp() { $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#logout').classList.remove('hidden'); loadOverview(); }

  $('#l-btn').onclick = async () => {
    $('#l-err').textContent = '';
    try {
      const res = await fetch('/auth/admin/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone: $('#l-phone').value, password: $('#l-pass').value})});
      if (!res.ok) throw new Error((await res.json()).error?.message || 'Login failed');
      store.token = (await res.json()).accessToken; showApp();
    } catch (e) { $('#l-err').textContent = e.message; }
  };
  $('#l-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#l-btn').click(); });
  $('#logout').onclick = () => { store.token = ''; showLogin(); };

  document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
    document.querySelectorAll('main section').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + b.dataset.tab));
    ({overview: loadOverview, users: loadUsers, sessions: loadSessions, activity: loadActivity})[b.dataset.tab]();
    if (b.dataset.tab === 'sessions') setTimeout(() => map.invalidateSize(), 50);
  });

  async function loadOverview() {
    const {totals: t, daily} = await api('/admin/stats?days=30');
    const cards = [['Users', t.users], ['Active (7 d)', t.active_users_7d], ['Devices', t.devices], ['Sessions', t.sessions], ['Open sessions', t.open_sessions],
      ['Distance', km(t.distance_m)], ['Moving time', dur(Number(t.moving_time_s))], ['Points', t.points], ['Map updates', t.map_updates], ['Last sync', when(t.last_sync_at)]];
    $('#cards').innerHTML = cards.map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('');
    const max = Math.max(1, ...daily.map(d => d.sessions));
    $('#chart').innerHTML = daily.map(d => `<div style="height:${(d.sessions / max) * 100}%" title="${esc(d.day.slice(0, 10))}: ${d.sessions} sessions, ${km(d.distance_m)}"></div>`).join('') || '<span style="color:var(--muted)">No sessions yet</span>';
  }

  async function loadUsers() {
    const rows = await api('/admin/users?q=' + encodeURIComponent($('#u-q').value));
    $('#u-rows').innerHTML = rows.map(u => `<tr class="row" data-id="${u.id}"><td>${esc(u.phone)}</td><td>${esc(u.displayName || '')}</td><td>${esc(u.role)}</td><td>${pill(u.status)}</td>
      <td>${u.stats.sessions}</td><td>${km(u.stats.distanceM)}</td><td>${dur(u.stats.movingTimeS)}</td><td>${u.stats.devices}</td><td>${when(u.lastSeenAt)}</td>
      <td><button class="ghost" data-act="${u.status === 'active' ? 'blocked' : 'active'}" data-id="${u.id}">${u.status === 'active' ? 'Block' : 'Unblock'}</button>
          <button class="ghost" data-sessions="${u.id}">Sessions</button></td></tr>`).join('') || '<tr><td colspan="10">No users</td></tr>';
  }
  $('#u-go').onclick = loadUsers;
  $('#u-rows').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act) { await api('/admin/users/' + b.dataset.id, {method: 'PATCH', body: JSON.stringify({status: b.dataset.act})}); loadUsers(); }
    if (b.dataset.sessions) { $('#s-user').value = b.dataset.sessions; document.querySelector('nav button[data-tab=sessions]').click(); }
  };

  const map = L.map('map').setView([34.8, 38.5], 6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'}).addTo(map);
  let routeLayer = null;

  async function loadSessions() {
    const p = new URLSearchParams();
    if ($('#s-user').value) p.set('userId', $('#s-user').value.trim());
    if ($('#s-status').value) p.set('status', $('#s-status').value);
    if ($('#s-from').value) p.set('from', new Date($('#s-from').value).toISOString());
    if ($('#s-to').value) p.set('to', new Date(new Date($('#s-to').value).getTime() + 864e5).toISOString());
    const rows = await api('/admin/sessions?' + p);
    $('#s-rows').innerHTML = rows.map(s => `<tr class="row" data-id="${s.id}"><td>${when(s.startedAt)}</td><td>${esc(s.userPhone)}</td><td>${pill(s.status)}</td>
      <td>${km(s.distanceM)}</td><td>${km(s.clientDistanceM)}</td><td>${dur(s.movingTimeS)}</td><td>${s.pointCount}</td></tr>`).join('') || '<tr><td colspan="7">No sessions</td></tr>';
  }
  $('#s-go').onclick = loadSessions;
  $('#s-rows').onclick = async e => {
    const tr = e.target.closest('tr.row'); if (!tr) return;
    const [detail, geo] = await Promise.all([api('/admin/sessions/' + tr.dataset.id), api('/admin/sessions/' + tr.dataset.id + '/geojson')]);
    if (routeLayer) map.removeLayer(routeLayer);
    routeLayer = L.geoJSON(geo, {style: f => f.properties.kind === 'route' ? {color: '#c1272d', weight: 4, opacity: .9} : {color: '#0c7c70', weight: 2, dashArray: '4 4'}}).addTo(map);
    if (geo.features.length) map.fitBounds(routeLayer.getBounds().pad(0.2));
    const {bbox, ...rest} = detail;
    $('#s-detail').textContent = JSON.stringify(rest, null, 2);
  };

  async function loadActivity() {
    const p = new URLSearchParams();
    if ($('#a-user').value) p.set('userId', $('#a-user').value.trim());
    if ($('#a-type').value) p.set('type', $('#a-type').value.trim());
    const rows = await api('/admin/activity?' + p);
    $('#a-rows').innerHTML = rows.map(a => `<tr><td>${when(a.occurredAt)}</td><td>${esc(a.userPhone)}</td><td>${esc(a.type)}</td><td>${esc(a.sessionId ? a.sessionId.slice(0, 8) : '')}</td><td><pre>${esc(a.payload ? JSON.stringify(a.payload) : '')}</pre></td></tr>`).join('') || '<tr><td colspan="5">No events</td></tr>';
  }
  $('#a-go').onclick = loadActivity;

  if (store.token) showApp(); else showLogin();
})();
</script>
</body>
</html>
